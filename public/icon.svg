<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer Gold Shield Frame -->
  <path d="M256 64 L384 116 C384 256 256 384 256 424 C256 384 128 256 128 116 Z" 
        fill="url(#shield)" 
        stroke="#f59e0b" 
        stroke-width="16" 
        stroke-linejoin="round"/>
        
  <!-- Inner Protection Emblem -->
  <path d="M256 96 L360 138 C360 250 256 356 256 388 C256 356 152 250 152 138 Z" 
        fill="#047857" 
        opacity="0.9"/>

  <!-- Stylized Agricultural Plant / Leaf -->
  <g transform="translate(256, 260)">
    <!-- Central Stalk -->
    <path d="M0 60 Q-4 10 0 -90" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" fill="none"/>
    
    <!-- Left Leaf -->
    <path d="M0 -30 C-60 -30 -80 -80 -70 -110 C-30 -110 -10 -60 0 -30 Z" fill="url(#leafGrad)"/>
    
    <!-- Right Leaf -->
    <path d="M0 0 C60 0 80 -50 70 -80 C30 -80 10 -30 0 0 Z" fill="#22c55e"/>

    <!-- Emerging Seed Bud -->
    <circle cx="0" cy="-94" r="12" fill="#fbbf24"/>
  </g>
</svg>